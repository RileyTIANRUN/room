<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家务分</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<main>
  <h1 id="title">家务分</h1>
  <input id="nameInput" maxlength="8" placeholder="名字" autocomplete="off">
  <p id="subtitle">今天做什么</p>
  <div id="todoList"></div>
  <p id="status">等待</p>
</main>
<button id="langBtn" type="button"></button>
<button id="rulesBtn" type="button" aria-label="规则">?</button>

<div id="rulesSheet" hidden>
  <div class="sheet" role="dialog" aria-labelledby="rulesTitle">
    <button id="rulesClose" type="button" aria-label="关闭">×</button>
    <h2 id="rulesTitle">规则</h2>
    <ul>
      <li data-key="r1"></li>
      <li data-key="r2"></li>
      <li data-key="r3"></li>
      <li data-key="r4"></li>
      <li data-key="r5"></li>
      <li data-key="r6"></li>
      <li data-key="r7"></li>
      <li data-key="r8"></li>
      <li data-key="r9"></li>
    </ul>
  </div>
</div>

<script src="lang.js"></script>
<script src="socket.io/socket.io.js"></script>
<script src="index.js"></script>
</body>
</html>
